<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АРИОН — маршрут</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=8c6b11a3-2c0d-4476-9823-ecbbd5e9df10&lang=ru_RU" type="text/javascript"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="text/javascript">
        ymaps.ready(init);

        function init() {
            // Центр карты (примерно посередине маршрута)
            var map = new ymaps.Map("map", {
                center: [59.931, 30.315],
                zoom: 14,
                controls: ['zoomControl']
            });

            // Точки маршрута: [широта, долгота, номер, название]
            var points = [
                [59.925338, 30.328850, 1, "Ворота казарм"],
                [59.924932, 30.327460, 2, "Выход на Гороховую"],
                [59.933645, 30.313919, 3, "Гороховая, 13"],
                [59.937167, 30.309029, 4, "Адмиралтейская пл."],
                [59.936800, 30.305500, 5, "Подход к Сенатской"],
                [59.936482, 30.302442, 6, "Сенатская площадь"]
            ];

            // Линия маршрута
            var lineCoords = points.map(function(p) { return [p[0], p[1]]; });
            var polyline = new ymaps.Polyline(lineCoords, {}, {
                strokeColor: "#C41E3A", // Наш красный кармин
                strokeWidth: 4,
                strokeOpacity: 0.7
            });
            map.geoObjects.add(polyline);

            // Метки с номерами
            points.forEach(function(p) {
                var placemark = new ymaps.Placemark([p[0], p[1]], {
                    balloonContent: p[3],
                    hintContent: p[2] + ". " + p[3]
                }, {
                    preset: "islands#redCircleIcon",
                    iconContentLayout: ymaps.templateLayoutFactory.createClass(
                        '<div style="color: white; font-weight: bold;">' + p[2] + '</div>'
                    )
                });
                map.geoObjects.add(placemark);
            });
            
            // Автоматически подгоняем карту под размеры маршрута
            map.setBounds(polyline.geometry.getBounds(), {
                checkZoomRange: true,
                zoomMargin: 40 // Отступы от краев экрана
            });
        }
    </script>
</body>
</html>
