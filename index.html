<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Mobile-first viewport для корректного масштабирования на телефонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a2e1a">
    <title>АРИОН</title>
    
    <!-- Подключение PWA манифеста -->
    <link rel="manifest" href="/arion/manifest.json">
    
    <!-- Подключение Яндекс.Карт API -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=8c6b11a3-2c0d-4476-9823-ecbbd5e9df10&lang=ru_RU" type="text/javascript"></script>
    
    <style>
        /* --- Базовые стили и сброс --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #1a2e1a; 
            font-family: 'Georgia', serif; /* Шрифт с засечками для исторического вайба */
        }
        
        /* --- Карта --- */
        #map { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }

        /* --- Экран приветствия (Splash Screen) --- */
        .welcome-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            background-image: linear-gradient(rgba(26, 46, 26, 0.85), rgba(15, 25, 15, 0.95)), url('https://images.unsplash.com/photo-1556614148-83a1e3834f2c?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .welcome-screen.hidden { opacity: 0; visibility: hidden; }
        .welcome-title { color: #ffffff; font-size: 48px; letter-spacing: 8px; margin-bottom: 10px; text-transform: uppercase; }
        .welcome-subtitle { color: #d1d5db; font-size: 16px; letter-spacing: 2px; margin-bottom: 40px; max-width: 300px; line-height: 1.5; }
        .start-btn {
            background-color: #C41E3A; color: white; border: 2px solid #C41E3A;
            padding: 15px 40px; font-size: 18px; font-weight: bold; letter-spacing: 2px;
            border-radius: 30px; cursor: pointer; transition: background-color 0.3s, color 0.3s;
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.4);
        }
        .start-btn:hover { background-color: transparent; color: #C41E3A; }

        /* --- Верхняя панель --- */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(26, 46, 26, 0.9), transparent);
            color: white; z-index: 10; pointer-events: none;
        }
        .top-bar h1 { font-size: 20px; font-weight: bold; letter-spacing: 2px; }

        /* --- Нижняя выезжающая панель (Bottom Sheet) --- */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background-color: #ffffff; border-radius: 20px 20px 0 0;
            z-index: 20; transform: translateY(100%); transition: transform 0.3s ease-out;
            display: flex; flex-direction: column; box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            font-family: sans-serif; /* Для читаемости текста */
        }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; background-color: #ccc; border-radius: 2px; margin: 10px auto; }
        .close-btn {
            position: absolute; top: 15px; right: 15px; background: #f0f0f0; border: none;
            border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; color: #333;
        }
        .sheet-content { padding: 0 20px 20px 20px; overflow-y: auto; flex-grow: 1; }
        .point-title { font-size: 22px; font-weight: bold; color: #1a2e1a; margin-bottom: 10px; margin-top: 10px; }
        .point-desc { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 20px; }
        .player-stub { background: #eaeaea; padding: 15px; border-radius: 10px; text-align: center; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div class="welcome-screen" id="welcomeScreen">
        <h1 class="welcome-title">АРИОН</h1>
        <p class="welcome-subtitle">Иммерсивная аудиопрогулка по местам восстания декабристов</p>
        <button class="start-btn" onclick="startApp()">НАЧАТЬ</button>
    </div>

    <!-- КАРТА -->
    <div id="map"></div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <h1>АРИОН</h1>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-sheet" id="pointSheet">
        <button class="close-btn" onclick="closeSheet()">✕</button>
        <div class="sheet-handle"></div>
        <div class="sheet-content">
            <div class="point-title" id="sheetTitle">Название точки</div>
            <div class="point-desc" id="sheetDesc">Здесь будет краткий текст...</div>
            <div class="player-stub">▶ Аудиоплеер (будет здесь)</div>
        </div>
    </div>

    <script type="text/javascript">
        // 1. Логика скрытия экрана приветствия
        function startApp() {
            document.getElementById('welcomeScreen').classList.add('hidden');
        }

        // 2. Инициализация карты (строго внутри ymaps.ready)
        ymaps.ready(init);

        function init() {
            var map = new ymaps.Map("map", {
                center: [59.931, 30.315],
                zoom: 14,
                controls: [] 
            });

            // Точки маршрута (координаты, номер, название, описание)
            var points = [
                [59.925338, 30.328850, 1, "Ворота казарм", "Здесь началось восстание. Солдаты вышли из этих ворот..."],
                [59.924932, 30.327460, 2, "Выход на Гороховую", "Колонна повернула на главную магистраль..."],
                [59.933645, 30.313919, 3, "Гороховая, 13", "Середина пути. Прямая перспектива улицы..."],
                [59.937167, 30.309029, 4, "Адмиралтейская пл.", "Историческая развилка. Поворот к Сенату..."],
                [59.936800, 30.305500, 5, "Подход к Сенатской", "Отсюда впервые показалось каре..."],
                [59.936482, 30.302442, 6, "Сенатская площадь", "Кульминация. Построение в каре у Медного всадника..."]
            ];

            // Рисуем линию маршрута
            var lineCoords = points.map(function(p) { return [p[0], p[1]]; });
            var polyline = new ymaps.Polyline(lineCoords, {}, {
                strokeColor: "#C41E3A", strokeWidth: 4, strokeOpacity: 0.8
            });
            map.geoObjects.add(polyline);

            // Добавляем метки
            points.forEach(function(p) {
                var placemark = new ymaps.Placemark([p[0], p[1]], {
                    hintContent: p[2] + ". " + p[3]
                }, {
                    preset: "islands#redCircleIcon",
                    iconContentLayout: ymaps.templateLayoutFactory.createClass(
                        '<div style="color: white; font-weight: bold; font-size: 16px;">' + p[2] + '</div>'
                    )
                });
                
                // Обработчик клика по метке
                placemark.events.add('click', function () {
                    openSheet(p[3], p[4]); 
                });

                map.geoObjects.add(placemark);
            });
            
            // Автоматически подгоняем карту под размеры маршрута
            map.setBounds(polyline.geometry.getBounds(), { checkZoomRange: true, zoomMargin: 50 });
        }

        // 3. Функции управления нижней панелью
        function openSheet(title, description) {
            document.getElementById('sheetTitle').innerText = title;
            document.getElementById('sheetDesc').innerText = description;
            document.getElementById('pointSheet').classList.add('active');
        }

        function closeSheet() {
            document.getElementById('pointSheet').classList.remove('active');
        }

        // 4. Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/arion/service-worker.js');
        }
    </script>
</body>
</html>
